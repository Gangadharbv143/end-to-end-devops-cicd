apiVersion: apps/v1
kind: Deployment
metadata:
  name: end-to-end-devops-cicd
  namespace: devops-cicd
  labels:
    app: end-to-end-devops-cicd
spec:
  replicas: 2
  selector:
    matchLabels:
      app: end-to-end-devops-cicd
  template:
    metadata:
      labels:
        app: end-to-end-devops-cicd
    spec:
      containers:
        - name: devops-app
          image: end-to-end-devops-cicd:monitoring-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          readinessProbe:
            httpGet:
              path: /ready
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
