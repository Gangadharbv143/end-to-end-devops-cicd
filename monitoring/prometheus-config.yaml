apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: devops-cicd
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: flask-app
        metrics_path: /metrics
        scrape_interval: 15s

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - devops-cicd

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: end-to-end-devops-cicd

          - source_labels:
              - __meta_kubernetes_pod_container_port_name
            action: keep
            regex: http

          - source_labels:
              - __meta_kubernetes_pod_phase
            action: keep
            regex: Running
